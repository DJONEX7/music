<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ One X7 | Official Music Hub</title>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #141414;
            --accent-color: #d4af37; /* ذهبي فخم */
            --accent-glow: rgba(212, 175, 55, 0.3);
            --text-color: #ffffff;
            --text-secondary: #999999;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 30px 0 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 1.1rem;
        }

        .player-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 25px;
            text-align: center;
        }

        .now-playing {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        audio {
            width: 100%;
            outline: none;
            border-radius: 8px;
        }

        .playlist {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .playlist h3 {
            margin-top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            color: var(--text-color);
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            margin-bottom: 8px;
            border: 1px solid transparent;
        }

        .track-item:hover, .track-item.active {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.4);
        }

        .track-title {
            font-weight: 500;
            font-size: 0.95rem;
            direction: ltr;
            text-align: left;
        }

        .play-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .social-links a {
            color: var(--text-color);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: 0.3s;
        }

        .social-links a:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>DJ ONE X7</h1>
            <p>Official Music & Remixes Hub</p>
        </header>

        <div class="player-card">
            <div class="now-playing" id="track-name">اختر أغنية للاستماع</div>
            <audio id="audio-player" controls></audio>
        </div>

        <div class="playlist">
            <h3>المقاطع والتراكات (10)</h3>
            
            <div class="track-item" onclick="changeTrack(0)">
                <span class="track-title">🎵 Can We Reach</span>
                <button class="play-btn">تشغيل</button>
            </div>
            <div class="track-item" onclick="changeTrack(1)">
                <span class="track-title">🎵 From The Ashes</span>
                <button class="play-btn">تشغيل</button>
            </div>
            <div class="track-item" onclick="changeTrack(2)">
                <span class="track-title">🎵 I Hear Your Name</span>
                <button class="play-btn">تشغيل</button>
            </div>
            <div class="track-item" onclick="changeTrack(3)">
                <span class="track-title">🎵 Keep It Going</span>
                <button class="play-btn">تشغيل</button>
            </div>
            <div class="track-item" onclick="changeTrack(4)">
                <span class="track-title">🎵 Late Nights Long Roads</span>
                <button class="play-btn">تشغيل</button>
            </div>
            <div class="track-item" onclick="changeTrack(5)">
                <span class="track-title">🎵 Lost In An Ocean</span>
                <button class="play-btn">تشغيل</button>
            </div>
            <div class="track-item" onclick="changeTrack(6)">
                <span class="track-title">🎵 Set Your Burdens</span>
                <button class="play-btn">تشغيل</button>
            </div>
            <div class="track-item" onclick="changeTrack(7)">
                <span class="track-title">🎵 With Every Day</span>
                <button class="play-btn">تشغيل</button>
            </div>
            <div class="track-item" onclick="changeTrack(8)">
                <span class="track-title">🎵 Cause We Are Born</span>
                <button class="play-btn">تشغيل</button>
            </div>
            <div class="track-item" onclick="changeTrack(9)">
                <span class="track-title">🎵 Die Krone - DJ One X7</span>
                <button class="play-btn">تشغيل</button>
            </div>
        </div>

        <div class="social-links">
            <a href="https://tiktok.com" target="_blank">TikTok</a>
            <a href="https://youtube.com" target="_blank">YouTube</a>
        </div>
    </div>

    <script>
        const playlist = [
            { name: "Can We Reach", url: "Can-we-reach.mp3" },
            { name: "From The Ashes", url: "From-the-ashes.mp3" },
            { name: "I Hear Your Name", url: "I-hear-your-name.mp3" },
            { name: "Keep It Going", url: "Keep-it-going.mp3" },
            { name: "Late Nights Long Roads", url: "Late-nights-long-roads.mp3" },
            { name: "Lost In An Ocean", url: "Lost-in-an-ocean.mp3" },
            { name: "Set Your Burdens", url: "Set-your-burdens.mp3" },
            { name: "With Every Day", url: "With-every-day.mp3" },
            { name: "Cause We Are Born", url: "cause-we-are-born.mp3" },
            { name: "Die Krone - DJ One X7", url: "die-Krone-DJ-one-X7.mp3" }
        ];

        let currentTrackIndex = 0;
        const player = document.getElementById('audio-player');
        const trackNameElem = document.getElementById('track-name');

        function loadTrack(index) {
            currentTrackIndex = index;
            player.src = playlist[index].url;
            trackNameElem.innerText = "Now Playing: " + playlist[index].name;
            
            // تحديث التظليل الذهبي على التراك الشغال
            const items = document.querySelectorAll('.track-item');
            items.forEach((item, idx) => {
                if(idx === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function changeTrack(index) {
            loadTrack(index);
            player.play();
        }

        // التشغيل التلقائي للتراك اللي بعده
        player.addEventListener('ended', function() {
            currentTrackIndex++;
            if (currentTrackIndex >= playlist.length) {
                currentTrackIndex = 0; // يرجع لأول تراك إذا خلصت القائمة
            }
            loadTrack(currentTrackIndex);
            player.play();
        });

        // تحميل أول تراك عند الفتح
        loadTrack(0);
    </script>
</body>
</html>
