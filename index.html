<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ One X7 | Official Music Hub</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161920;
            --accent-color: #00f2fe;
            --text-color: #ffffff;
            --text-secondary: #a0a5b5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 40px 0 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 1.1rem;
        }

        .player-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
            text-align: center;
        }

        .now-playing {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        audio {
            width: 100%;
            outline: none;
            border-radius: 8px;
        }

        .playlist {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .playlist h3 {
            margin-top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            color: var(--text-color);
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 8px;
        }

        .track-item:hover {
            background: rgba(0, 242, 254, 0.1);
        }

        .track-title {
            font-weight: 500;
        }

        .play-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .social-btn {
            color: var(--text-color);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .social-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>DJ ONE X7</h1>
            <p>Official Music & Remixes Hub</p>
        </header>

        <div class="player-card">
            <div class="now-playing" id="track-name">اختر أغنية للاستماع</div>
            <audio id="audio-player" controls>
                متصفحك لا يدعم مشغل الصوتيات.
            </audio>
        </div>

        <div class="playlist">
            <h3>المقاطع والتراكات</h3>
            
            <div class="track-item" onclick="playTrack('كشتم (Keshtam)', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">
                <span class="track-title">🎵 كشتم (Keshtam)</span>
                <button class="play-btn">تشغيل</button>
            </div>

            <div class="track-item" onclick="playTrack('طنش وعيش (Remix)', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3')">
                <span class="track-title">🎵 طنش وعيش (Remix)</span>
                <button class="play-btn">تشغيل</button>
            </div>

            <div class="track-item" onclick="playTrack('يا زين عيونك', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3')">
                <span class="track-title">🎵 يا زين عيونك</span>
                <button class="play-btn">تشغيل</button>
            </div>
        </div>

        <div class="social-links">
            <a href="https://youtube.com" target="_blank" class="social-btn">YouTube</a>
            <a href="https://tiktok.com" target="_blank" class="social-btn">TikTok</a>
        </div>
    </div>

    <script>
        function playTrack(name, url) {
            var player = document.getElementById('audio-player');
            var trackName = document.getElementById('track-name');
            
            player.src = url;
            trackName.innerText = "Now Playing: " + name;
            player.play();
        }
    </script>
</body>
</html>
